name: Claude OAuth Smoke Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Safe prompt for validating Claude OAuth in GitHub Actions
        required: false
        default: Reply exactly with CLAUDE_OAUTH_SMOKE_OK. Do not modify files.

permissions:
  contents: read

concurrency:
  group: claude-oauth-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm smoke-test configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "action_ref=anthropics/claude-code-action@v1"
          echo "oauth_input=claude_code_oauth_token"
          echo "show_full_output=false"
          echo "anthropic_api_key_used=false"

      - name: Run Claude OAuth smoke test
        id: claude
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: ${{ inputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 1
            --allowedTools "Read,LS"

      - name: Capture sanitized Claude result
        if: always()
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          echo "claude_outcome=${CLAUDE_OUTCOME:-unknown}"
          echo "claude_conclusion=${CLAUDE_CONCLUSION:-unknown}"
          if [[ -n "${CLAUDE_EXECUTION_FILE:-}" && -f "$CLAUDE_EXECUTION_FILE" ]]; then
            node <<'NODE'
          const fs = require('fs');
          const file = process.env.CLAUDE_EXECUTION_FILE;
          const text = fs.readFileSync(file, 'utf8');

          function redact(value) {
            return String(value)
              .replace(/sk-ant-[A-Za-z0-9._-]+/g, '[redacted-token]')
              .replace(/gh[pousr]_[A-Za-z0-9_]+/g, '[redacted-token]')
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[redacted-email]');
          }

          let parsed;
          try {
            parsed = JSON.parse(text);
          } catch (error) {
            console.log(`claude_execution_parse_error=${redact(error.message)}`);
            process.exit(0);
          }

          const wanted = [];
          function collect(value, path = '') {
            if (value === null || value === undefined) return;
            if (Array.isArray(value)) {
              value.forEach((entry, index) => collect(entry, `${path}[${index}]`));
              return;
            }
            if (typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) collect(entry, path ? `${path}.${key}` : key);
              return;
            }
            const leaf = path.split('.').pop().replace(/\[\d+\]$/, '').toLowerCase();
            if (!['api_error_status', 'error', 'error_message', 'error_status', 'is_error', 'result', 'status', 'subtype', 'terminal_reason'].includes(leaf)) {
              return;
            }
            const line = `${path}=${redact(value).replace(/\s+/g, ' ').trim()}`;
            if (line.length <= 1000) wanted.push(line);
          }

          collect(parsed);
          for (const line of wanted.slice(0, 20)) console.log(line);
          NODE
          else
            echo "claude_execution_file=missing"
          fi

      - name: Fail when Claude action failed
        if: steps.claude.outcome != 'success'
        shell: bash
        run: |
          echo "Claude OAuth smoke test failed."
          exit 1
