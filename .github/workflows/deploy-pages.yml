name: Publish Prototype Home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish main build to gh-pages root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages_dir="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages "$pages_dir" origin/gh-pages
          else
            git worktree add --detach "$pages_dir"
            (
              cd "$pages_dir"
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          rsync -a --delete --exclude='.git' --exclude='previews' dist/ "$pages_dir"/
          touch "$pages_dir/.nojekyll"

          (
            cd "$pages_dir"
            git add --all
            if git diff --cached --quiet; then
              echo "No GitHub Pages changes to publish."
            else
              git commit -m "Publish prototype home from main"
              git push origin HEAD:gh-pages
            fi
          )
